name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - run: cmake -S . -B build -A Win32
      - run: cmake --build build --config Release
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: build/Release/sampbot.dll

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - run: sudo apt-get update && sudo apt-get install -y g++-multilib
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: build/sampbot.so

  release:
    needs: [windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: windows
          path: win
      - uses: actions/download-artifact@v4
        with:
          name: linux
          path: lin
      - name: Assemble archives
        run: |
          cp sampbot.inc win/
          printf 'EXPORTS\nSupports\nLoad\nUnload\nAmxLoad\nAmxUnload\n' > win/sampbot.def
          cp sampbot.inc lin/
          (cd win && zip "../sampbot-windows.zip" sampbot.dll sampbot.inc sampbot.def)
          (cd lin && zip "../sampbot-linux.zip" sampbot.so sampbot.inc)
      - uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          files: |
            sampbot-windows.zip
            sampbot-linux.zip
          body: |
            Ready-to-use builds for SA-MP 0.3.DL-R1.

            - `sampbot-windows.zip` — sampbot.dll + sampbot.inc + sampbot.def
            - `sampbot-linux.zip` — sampbot.so + sampbot.inc
